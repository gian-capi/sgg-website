<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGG Admin Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,100..900;1,75..125,100..900&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233D2B68'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='bold' fill='%23fff' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <a href="/dashboard" class="display wordmark" data-route>SIGNATURE<br>GALLERY GROUP</a>
      <p class="label sub">Admin &amp; Analytics</p>
    </div>

    <div class="nav-group">
      <span class="label">Overview</span>
      <a class="nav-item" href="/dashboard" data-route data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a class="nav-item" href="/reports" data-route data-nav="reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Reports
      </a>
      <a class="nav-item" href="/inquiries" data-route data-nav="inquiries">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        Inquiries <span class="count" data-badge="inquiries"></span>
      </a>
    </div>

    <div class="nav-group">
      <span class="label">Catalog</span>
      <a class="nav-item" href="/artists" data-route data-nav="artists">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>
        Artists <span class="count" data-badge="artists"></span>
      </a>
      <a class="nav-item" href="/artworks" data-route data-nav="artworks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M3.5 15.5l4.5-4.2 3.6 3.3 3.8-4.6 5.1 5.4"/></svg>
        Artworks <span class="count" data-badge="artworks"></span>
      </a>
      <a class="nav-item" href="/releases" data-route data-nav="releases">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8z"/></svg>
        New Releases
      </a>
      <a class="nav-item" href="/events" data-route data-nav="events">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        Events <span class="count" data-badge="events"></span>
      </a>
      <a class="nav-item" href="/galleries" data-route data-nav="galleries">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        Galleries <span class="count" data-badge="galleries"></span>
      </a>
    </div>

    <div class="nav-group">
      <span class="label">Website</span>
      <a class="nav-item" href="/homepage" data-route data-nav="homepage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        Homepage
      </a>
      <a class="nav-item" href="/media" data-route data-nav="media">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>
        Media
      </a>
      <a class="nav-item" href="/settings" data-route data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7.5a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        Settings
      </a>
      <a class="nav-item" href="/users" data-route data-nav="users" data-owner-only hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.4 2.9-5.3 6.5-5.3s6.5 1.9 6.5 5.3"/><path d="M17 11.2a3 3 0 1 0-1.6-5.5M18 20c0-2.2-.9-3.8-2.4-4.7"/></svg>
        Team
      </a>
    </div>

    <div class="sidebar-foot">
      <div class="row" style="margin-bottom:.6rem">
        <div style="min-width:0">
          <div class="small truncate" data-user-name>—</div>
          <div class="label" data-user-role></div>
        </div>
        <div class="spacer"></div>
        <form method="post" action="/logout"><button class="btn btn-sm" type="submit">Exit</button></form>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 class="display" data-page-title>Dashboard</h1>
      <div class="spacer"></div>
      <div class="row small" data-publish-state></div>
      <button class="btn btn-primary" data-publish-btn>PUBLISH TO SITE</button>
    </header>
    <div class="content" data-view>
      <div class="empty"><span class="spin" style="display:inline-block"></span></div>
    </div>
  </div>
</div>

<div class="drawer-back" data-drawer-back></div>
<aside class="drawer" data-drawer>
  <div class="drawer-head">
    <h2 class="display" data-drawer-title>Edit</h2>
    <div class="spacer"></div>
    <button class="btn btn-sm" data-drawer-close>Close</button>
  </div>
  <div class="drawer-body" data-drawer-body></div>
  <div class="drawer-foot" data-drawer-foot></div>
</aside>

<div class="toasts" data-toasts></div>

<script type="module" src="/assets/app.js"></script>
</body>
</html>
